@if (isOpen()) {
  <aside class="widget-drawer" aria-labelledby="widget-drawer-title">
    <header class="widget-drawer__header">
      <h2 id="widget-drawer-title">Add widget</h2>
      <button
        type="button"
        class="drawer-close"
        data-testid="close-widget-drawer"
        aria-label="Close add widget drawer"
        (click)="closed.emit()"
      >
        ×
      </button>
    </header>

    <div class="widget-drawer__body">
      <label class="search-field" for="widget-search">
        <span class="visually-hidden">Search widgets</span>
        <span class="search-field__icon" aria-hidden="true">⌕</span>
        <input
          id="widget-search"
          data-testid="widget-search"
          type="search"
          placeholder="Search widgets..."
          autocomplete="off"
          [value]="searchQuery()"
          (input)="updateSearchQuery($event)"
        />
      </label>

      <div class="widget-list" data-testid="available-widgets">
        @for (
          installation of filteredInstallations();
          track installation.type
        ) {
          <article class="drawer-widget" data-testid="available-widget">
            <span
              class="drawer-widget__icon"
              [style.--widget-accent]="widgetAccent(installation.type)"
              aria-hidden="true"
            >
              <span></span><span></span><span></span><span></span>
            </span>
            <div class="drawer-widget__details">
              <h3>{{ installation.displayName }}</h3>
              @if (installation.description) {
                <p>{{ installation.description }}</p>
              }
            </div>
            <button
              type="button"
              class="drawer-widget__add"
              data-testid="add-widget"
              (click)="addWidget(installation)"
            >
              Add
            </button>
          </article>
        }
      </div>
    </div>

    <footer class="widget-drawer__footer">
      <a
        class="manage-installations"
        data-testid="manage-installed-widgets"
        [routerLink]="['/widgets']"
        [queryParams]="{ returnTo: 'add-widget' }"
        (click)="closed.emit()"
      >
        <span class="manage-installations__icon" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span>Manage installed widgets</span>
        <span class="manage-installations__arrow" aria-hidden="true">›</span>
      </a>
    </footer>
  </aside>
}
