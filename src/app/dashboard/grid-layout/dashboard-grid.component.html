<section
  #grid
  class="grid-stack"
  [class.grid-stack--single-column]="narrowScreen()"
  aria-label="Dashboard widgets"
>
  @for (widget of dashboard().widgets; track widget.id) {
    @let installation = installationFor(widget.type);
    <section
      class="grid-stack-item"
      [attr.gs-id]="widget.id"
      [attr.gs-x]="widget.layout.x"
      [attr.gs-y]="widget.layout.y"
      [attr.gs-w]="widget.layout.w"
      [attr.gs-h]="widget.layout.h"
    >
      <div class="grid-stack-item-content widget-frame">
        @if (installation; as resolvedInstallation) {
          <app-widget-element
            [installation]="resolvedInstallation"
            [widgetId]="widget.id"
            [configuration]="widget.configuration"
            (changed)="widgetConfigurationChanged.emit($event)"
            (unavailable)="markWidgetUnavailable(widget.id)"
            (removed)="widgetRemoved.emit(widget.id)"
          />
        } @else {
          <app-unavailable-widget-card
            [widgetType]="widget.type"
            [configuration]="widget.configuration"
            (removed)="widgetRemoved.emit(widget.id)"
          />
        }

        @if (!narrowScreen()) {
          <div class="widget-frame__controls">
            <button
              type="button"
              class="widget-drag-handle"
              aria-label="Move widget"
              title="Drag to move widget"
            >
              <span aria-hidden="true">⠿</span>
            </button>
            <button
              type="button"
              class="widget-menu-trigger"
              data-testid="widget-action-menu"
              aria-label="Widget actions"
              [cdkMenuTriggerFor]="widgetActionMenu"
            >
              <span aria-hidden="true">⋮</span>
            </button>
          </div>

          <ng-template #widgetActionMenu>
            <div class="widget-action-menu" cdkMenu>
              @if (installation && !isWidgetUnavailable(widget.id)) {
                <button
                  type="button"
                  cdkMenuItem
                  data-testid="edit-widget-instance"
                  (click)="widgetEditRequested.emit(widget)"
                >
                  Edit
                </button>
                <button
                  type="button"
                  cdkMenuItem
                  data-testid="duplicate-widget-instance"
                  (click)="widgetDuplicated.emit(widget.id)"
                >
                  Duplicate
                </button>
              }
              <button
                type="button"
                cdkMenuItem
                class="widget-action-menu__remove"
                data-testid="remove-widget-instance"
                (click)="widgetRemoved.emit(widget.id)"
              >
                Remove
              </button>
            </div>
          </ng-template>
        }
      </div>
    </section>
  }
</section>
